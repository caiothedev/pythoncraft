name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Verificar sintaxe
        run: python -m compileall -q game main.py tests
      - name: Rodar testes
        run: coverage run --branch -m unittest discover tests -v
      - name: Medir cobertura
        run: coverage report --fail-under=60
      - name: Verificar lint
        run: ruff check game main.py tests
      - name: Verificar tipos
        run: mypy game/core/world.py game/core/container.py game/core/daynight.py game/core/mining.py game/core/modes.py game/core/physics.py game/core/state.py game/core/vitals.py game/craft.py